services:
  app:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://forgeboard:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@db:5432/forgeboard
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Generate APP_ENCRYPTION_KEY}
      PUBLIC_URL: https://${DOMAIN:?Set DOMAIN}
      HOST: 0.0.0.0
      TRUST_PROXY: '1'
      INTEGRATION_ALLOWED_ORIGINS: ${INTEGRATION_ALLOWED_ORIGINS:-}
    depends_on:
      db:
        condition: service_healthy
    networks: [backend, frontend]
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeboard
      POSTGRES_DB: forgeboard
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes: [postgres:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U forgeboard -d forgeboard']
      interval: 5s
      timeout: 3s
      retries: 20
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80','443:443']
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN}
    volumes: ['./ops/Caddyfile:/etc/caddy/Caddyfile:ro', 'caddy_data:/data', 'caddy_config:/config']
    depends_on: [app]
    networks: [frontend]
networks:
  backend:
    internal: true
  frontend:
volumes:
  postgres:
  caddy_data:
  caddy_config:
