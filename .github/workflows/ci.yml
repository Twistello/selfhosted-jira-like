name: checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: forgeboard
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: forgeboard
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U forgeboard"
          --health-interval 5s --health-timeout 3s --health-retries 15
    env:
      DATABASE_URL: postgresql://forgeboard:ci-only-password@127.0.0.1:5432/forgeboard
      E2E_DATABASE_URL: postgresql://forgeboard:ci-only-password@127.0.0.1:5432/forgeboard
      PUBLIC_URL: http://127.0.0.1:3000
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Ephemeral encryption key
        run: echo "APP_ENCRYPTION_KEY=$(node -e "console.log(require('crypto').randomBytes(32).toString('base64'))")" >> "$GITHUB_ENV"
      - run: npm run check:secrets
      - run: npm run migrate
      - run: npm run migrate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t forgeboard:ci .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-report
          path: playwright-report/
